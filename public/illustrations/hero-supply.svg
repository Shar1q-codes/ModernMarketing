<svg width="640" height="480" viewBox="0 0 640 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="40" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66D1FF" stop-opacity="0.85" />
      <stop offset="0.5" stop-color="#FF7EA5" stop-opacity="0.4" />
      <stop offset="1" stop-color="#FFB14F" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="warehouse" x1="120" y1="140" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101B32" />
      <stop offset="1" stop-color="#1F2F58" />
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB14F" />
      <stop offset="1" stop-color="#FF7EA5" />
    </linearGradient>
    <linearGradient id="crane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7D7FFF" />
      <stop offset="1" stop-color="#2ED8C3" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="480" fill="#070B16" />
  <rect x="0" y="0" width="640" height="480" fill="url(#heroSky)" opacity="0.6" />
  <g filter="url(#shadowSoft)">
    <rect x="120" y="140" width="400" height="220" rx="30" fill="url(#warehouse)" stroke="#2E3F6B" stroke-width="2" />
    <rect x="160" y="180" width="80" height="120" rx="16" fill="#17264A" />
    <rect x="260" y="180" width="120" height="140" rx="18" fill="#1D2E54" />
    <rect x="400" y="180" width="80" height="100" rx="16" fill="#13203E" />
  </g>
  <rect x="220" y="220" width="40" height="12" rx="6" fill="#66D1FF" />
  <rect x="220" y="240" width="40" height="12" rx="6" fill="#FFB14F" opacity="0.85" />
  <rect x="220" y="260" width="40" height="12" rx="6" fill="#2ED8C3" opacity="0.85" />
  <g opacity="0.9">
    <rect x="120" y="340" width="420" height="12" rx="6" fill="#0E162A" />
    <rect x="170" y="312" width="150" height="60" rx="18" fill="url(#truck)" />
    <circle cx="205" cy="360" r="18" fill="#070B16" stroke="#4A5F94" stroke-width="4" />
    <circle cx="285" cy="360" r="18" fill="#070B16" stroke="#4A5F94" stroke-width="4" />
    <rect x="330" y="300" width="140" height="48" rx="18" fill="#142446" stroke="#2D3D68" stroke-width="2" />
    <rect x="340" y="308" width="56" height="24" rx="10" fill="#66D1FF" />
  </g>
  <g opacity="0.75">
    <rect x="460" y="120" width="10" height="150" rx="5" fill="url(#crane)" />
    <rect x="470" y="140" width="90" height="10" rx="5" fill="url(#crane)" />
    <rect x="550" y="140" width="12" height="80" rx="6" fill="#FFB14F" />
    <rect x="520" y="200" width="60" height="18" rx="9" fill="#2ED8C3" />
  </g>
  <defs>
    <filter id="shadowSoft" x="100" y="120" width="440" height="260" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feGaussianBlur in="BackgroundImageFix" stdDeviation="18" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
    </filter>
  </defs>
</svg>
